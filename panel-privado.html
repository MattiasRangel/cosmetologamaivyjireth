<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- Sin meta tags de SEO ni Open Graph a propósito: esta ruta no debe
     promocionarse ni indexarse. Si el hosting lo permite, complementa esto
     con un robots.txt que bloquee /panel-privado.html y /panel-admin.html. -->
<meta name="robots" content="noindex, nofollow" />
<title>Panel privado</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/panel-styles.css" />
</head>
<body>

<!-- ==========================================================================
     PANTALLA DE LOGIN — página independiente (no comparte HTML con el panel).
     Sin enlaces a la página pública ni botón "volver al inicio", a propósito.
=========================================================================== -->
<div class="login-view">
  <div class="login-card">
    <div class="login-brand">
      <img src="/imagenes/logocosmec.jpeg" alt="Maivy Jireth Cosmetóloga" class="login-brand-mark" />
      <p class="login-brand-name">Maivy Jireth</p>
    </div>
    <h1 class="login-title">Panel privado</h1>
    <p class="login-subtitle">Acceso exclusivo para administración del negocio.</p>

    <form id="login-form" class="login-form" novalidate>
      <label class="field">
        <span class="field-label">Correo electrónico</span>
        <input type="email" id="login-email" name="email" placeholder="tucorreo@ejemplo.com" autocomplete="username" required />
      </label>
      <label class="field">
        <span class="field-label">Contraseña</span>
        <input type="password" id="login-password" name="password" placeholder="••••••••" autocomplete="current-password" required />
      </label>

      <p id="login-error" class="login-error" hidden></p>

      <button type="submit" id="login-submit" class="btn btn-primary btn-block">
        <span class="btn-label">Ingresar</span>
        <span class="btn-spinner" hidden></span>
      </button>
    </form>

    <p class="login-hint">
      <code></code> <code></code>.
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-client.js"></script>
<script type="module" src="/js/panel-login.js"></script>
</body>
</html>
